# Serena Configuration for admin-loja-disco
project_name: admin-loja-disco
project_type: nextjs
description: Next.js Admin Dashboard for Disco Shop Management

# Language servers configuration
language_servers:
  typescript-language-server:
    enabled: true
    args:
      - "--stdio"
  
# Project structure hints
project_hints:
  source_dir: src
  test_dir: src/test
  config_files:
    - tsconfig.json
    - next.config.ts
    - eslint.config.mjs
    - prettier.config.js

# Code search settings
search:
  include_patterns:
    - "src/**/*.tsx"
    - "src/**/*.ts"
    - "src/**/*.jsx"
    - "src/**/*.js"
  exclude_patterns:
    - "node_modules"
    - ".next"
    - "dist"
    - "build"
    - ".git"

# Refactoring settings
refactoring:
  auto_format: true
  formatter: prettier

# Memory settings
memory:
  enabled: true
  storage_dir: .serena/memory
